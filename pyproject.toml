[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-library-analyzer"
version = "0.1.0"
description = "Analyze your Steam library: hours played per genre, top games and your backlog of unplayed games."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["steam", "games", "statistics", "cli", "backlog"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
steam-analyzer = "steam_library_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
